[package]
name = "shark"
version = "0.0.1"
edition = "2021"
publish = false
description = "Shark file manager for Windows and Linux"

[lib]
name = "shark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify-debouncer-mini = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shark-core = { path = "../core" }
tauri = { version = "2", features = [] }
