# Tests the Windows/Linux port on every push and pull request that touches it.
name: Port CI

on:
  workflow_dispatch:
  push:
    paths: ["port/**", ".github/workflows/port-ci.yml"]
  pull_request:
    paths: ["port/**", ".github/workflows/port-ci.yml"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: port
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: port/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            port/core
            port/src-tauri
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --manifest-path core/Cargo.toml
      - name: Build the app shell
        run: |
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
